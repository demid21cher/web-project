{% extends 'weather/base.html' %}
{% block content %}

<h1>Login</h1>

<form method="post">
    {% csrf_token %}

    {{ form.non_field_errors }}

    <p>
        {{ form.email.label_tag }}
        {{ form.email }}
        {{ form.email.errors }}
    </p>

    <p>
        {{ form.password.label_tag }}
        {{ form.password }}
        {{ form.password.errors }}
    </p>

    <button type="submit">Login</button>
</form>

{% endblock %}
