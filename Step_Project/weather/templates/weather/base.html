{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather</title>
    <link
        rel="stylesheet"
        href="{% static 'weather/css/style.css' %}"
    />
</head>
<body>
    <header class="main_menu">
        <nav>
            <a href="/">Main</a>
            {% if user.is_authenticated %}
                <a href="/history/">History</a>
                <a href="/logout/">Log out</a>
            {% else %}
                <a href="/login">Login</a>
                <a href="/register/">Registration</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
